name: sys.service_status
description: Query status of a systemd service
params_schema:
  type: object
  required:
  - service
  properties:
    service:
      type: string
tier: L0
effect_class: reversible
approval_mode: automatic
sandbox_profile: system_query
undo_method: none
taint_rules:
  disallow_untrusted_keys: []
  require_user_confirmation: false
