name: outbox.cancel
description: Cancel a pending outbox item during undo window (user only)
params_schema:
  type: object
  required:
  - item_id
  properties:
    item_id:
      type: string
tier: L0
effect_class: reversible
approval_mode: user_confirm
sandbox_profile: outbox_admin
undo_method: none
taint_rules:
  disallow_untrusted_keys:
  - item_id
  require_user_confirmation: true
