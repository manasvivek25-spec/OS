name: hw.rfkill_set
description: Toggle RFKill state (wifi, bluetooth)
params_schema:
  type: object
  required:
  - subsystem
  - state
  properties:
    subsystem:
      type: string
      enum:
      - wlan
      - bluetooth
      - all
    state:
      type: string
      enum:
      - block
      - unblock
tier: L2
effect_class: compensable
approval_mode: user_confirm
sandbox_profile: hw_control
undo_method: restore_rfkill
taint_rules:
  disallow_untrusted_keys: []
  require_user_confirmation: true
