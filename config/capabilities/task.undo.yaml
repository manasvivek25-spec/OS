name: task.undo
description: Rollback a task to its pre-execution checkpoint (user only)
params_schema:
  type: object
  required:
  - task_id
  properties:
    task_id:
      type: string
tier: L0
effect_class: reversible
approval_mode: user_confirm
sandbox_profile: task_admin
undo_method: none
taint_rules:
  disallow_untrusted_keys:
  - task_id
  require_user_confirmation: true
