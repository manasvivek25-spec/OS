name: hw.volume_set
description: Set audio output volume
params_schema:
  type: object
  required:
  - volume
  properties:
    volume:
      type: integer
      minimum: 0
      maximum: 100
tier: L1
effect_class: compensable
approval_mode: automatic
sandbox_profile: hw_control
undo_method: restore_volume
taint_rules:
  disallow_untrusted_keys: []
  require_user_confirmation: false
