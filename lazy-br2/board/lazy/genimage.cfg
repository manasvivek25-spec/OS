image efi-part.vfat {
	vfat {
		file startup.nsh {
			image = "efi-part/startup.nsh"
		}
		file EFI {
			image = "efi-part/EFI"
		}
	}
	size = 64M
}

image lazy-os.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = "U"
		bootable = "true"
		offset = 1M
	}

	partition root {
		image = "rootfs.squashfs"
		partition-type-uuid = "L"
	}

	partition data {
		image = "lazy-data.btrfs"
		partition-type-uuid = "L"
	}
}
