image efi-part.vfat {
	vfat {
		file startup.nsh {
			image = "efi-part/startup.nsh"
		}
		file EFI {
			image = "efi-part/EFI"
		}
	}
	size = 64M
}

image lazy-data.btrfs {
	btrfs {
		label = "LAZY_DATA"
	}
	size = 256M
}

image lazy-os.img {
	hdimage {
		partition-table-type = "gpt"
		gpt-location = 2M
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = "U"
		bootable = "true"
		offset = 2M
		size = 64M
	}

	partition root {
		image = "rootfs.squashfs"
		partition-type-uuid = "L"
		size = 512M
	}

	partition data {
		image = "lazy-data.btrfs"
		partition-type-uuid = "L"
		size = 256M
	}
}
