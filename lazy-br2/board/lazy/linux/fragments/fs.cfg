# Lazy OS Custom Kernel Fragment: fs
# Storage backends: Read-only SquashFS, Btrfs with snapshots, and OverlayFS

# SquashFS read-only root
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_ZSTD=y
CONFIG_SQUASHFS_FILE_DIRECT=y

# Btrfs data volume with subvolume snapshots
CONFIG_BTRFS_FS=y
CONFIG_BTRFS_FS_POSIX_ACL=y
CONFIG_BTRFS_FS_CHECK_INTEGRITY=y

# OverlayFS for writable /etc and /var overlays
CONFIG_OVERLAY_FS=y
CONFIG_OVERLAY_FS_REDIRECT_DIR=y
CONFIG_OVERLAY_FS_INDEX=y

# Standard supporting filesystems
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_EXT4_FS=y
