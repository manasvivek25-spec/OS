# Lazy OS Custom Kernel Fragment: laptop
# Hardware control drivers: ACPI, Backlight, RFKILL, CPU Governors, USB Authorization

# ACPI and Backlight
CONFIG_ACPI=y
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_BACKLIGHT_GENERIC=y

# RFKILL (Radio frequency kill switch)
CONFIG_RFKILL=y
CONFIG_RFKILL_INPUT=y

# CPU Frequency Scaling & Governors
CONFIG_CPU_FREQ=y
CONFIG_CPU_FREQ_GOV_PERFORMANCE=y
CONFIG_CPU_FREQ_GOV_POWERSAVE=y
CONFIG_CPU_FREQ_GOV_USERSPACE=y
CONFIG_CPU_FREQ_GOV_ONDEMAND=y
CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y
CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y

# USB Subsystem & Device Authorization (hw.usb_authorize)
CONFIG_USB=y
CONFIG_USB_SUPPORT=y
CONFIG_USB_DEVICEFS=y
CONFIG_USB_DEFAULT_AUTHORIZATION_MODE=1

# Input Subsystem & Event Devices (Keyboard, Mouse, Tablet, Touchpad for libinput/Wayland)
CONFIG_INPUT=y
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_KEYBOARD=y
CONFIG_KEYBOARD_ATKBD=y
CONFIG_INPUT_MOUSE=y
CONFIG_MOUSE_PS2=y
CONFIG_INPUT_MISC=y
CONFIG_INPUT_UINPUT=y
CONFIG_VIRTIO_INPUT=y
