<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portal Login</title>
</head>
<body>
    <h2>User Authentication</h2>
    <form id="login-form" action="index.html" method="POST">
        <div>
            <label for="username-field">Username:</label>
            <input type="text" id="username-field" name="username" value="">
        </div>
        <div>
            <label for="password-field">Password:</label>
            <input type="password" id="password-field" name="password" value="">
        </div>
        <button id="submit-login" type="submit">Sign In</button>
    </form>
</body>
</html>
