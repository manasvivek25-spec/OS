# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/images/*.bb"

BBFILE_COLLECTIONS += "meta-lazy"
BBFILE_PATTERN_meta-lazy = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-lazy = "10"

LAYERDEPENDS_meta-lazy = "core openembedded-layer"
LAYERSERIES_COMPAT_meta-lazy = "scarthgap"
