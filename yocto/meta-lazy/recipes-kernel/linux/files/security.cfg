# Lazy OS Custom Kernel Fragment: security
# Hardening measures: Landlock LSM, Yama, Seccomp-BPF, Stack Protector, KASLR, Strict W^X

# Security Framework & LSMs
CONFIG_SECURITY=y
CONFIG_SECURITY_NETWORK=y
CONFIG_SECURITY_LANDLOCK=y
CONFIG_SECURITY_YAMA=y
CONFIG_LSM="landlock,yama,lockdown,integrity"

# Seccomp-BPF (Required for systemd SystemCallFilter sandboxing)
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y

# Stack protection & Compiler fortification
CONFIG_STACKPROTECTOR=y
CONFIG_STACKPROTECTOR_STRONG=y
CONFIG_FORTIFY_SOURCE=y

# Memory & Kernel Execution Protections
CONFIG_STRICT_KERNEL_RWX=y
CONFIG_STRICT_MODULE_RWX=y
CONFIG_PAGE_TABLE_ISOLATION=y
CONFIG_RANDOMIZE_BASE=y
CONFIG_RANDOMIZE_MEMORY=y

# Block raw memory snooping
# CONFIG_DEVMEM is not set
# CONFIG_DEVPORT is not set
