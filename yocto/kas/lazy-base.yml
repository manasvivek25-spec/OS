header:
  version: 14

machine: qemux86-64
distro: poky
target: lazy-image-base

repos:
  poky:
    url: "https://git.yoctoproject.org/poky"
    commit: "6b7c1066f778db5a6b3e35400617b10342988fa8"
    branch: "scarthgap"
    layers:
      meta:
      meta-poky:

  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"
    commit: "2db6aece32c7f8ebf6015b468e1b4e21de072e3b"
    branch: "scarthgap"
    layers:
      meta-oe:
      meta-python:
      meta-networking:

  meta-lazy:
    path: "yocto/meta-lazy"

local_conf_header:
  init-system: |
    INIT_MANAGER = "systemd"
  image-features: |
    EXTRA_IMAGE_FEATURES = "debug-tweaks ssh-server-openssh"
  disk-space: |
    BB_DISKMON_DIRS = ""
  image-types: |
    IMAGE_FSTYPES = "squashfs-xz ext4"
  build-hygiene: |
    DL_DIR = "/home/manas/yocto-cache/downloads"
    SSTATE_DIR = "/home/manas/yocto-cache/sstate-cache"
    INHERIT += "rm_work"
    BB_NUMBER_THREADS = "6"
    PARALLEL_MAKE = "-j 6"
    BB_HASHSERVE = "auto"
    SSTATE_MIRRORS ?= "file://.* https://sstate.yoctoproject.org/all/PATH;downloadfilename=PATH"
